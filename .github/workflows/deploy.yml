name: Deploy to Dokploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Dokploy redeploy
        run: |
          curl -fsS -X POST "http://31.97.65.6:3000/api/trpc/application.deploy?batch=1" \
            -H "x-api-key: ${{ secrets.DOKPLOY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"0":{"json":{"applicationId":"fbSbk00ufrqLgvMkju03R"}}}'
